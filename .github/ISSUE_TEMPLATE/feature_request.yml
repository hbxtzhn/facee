name: 功能建议
description: 提一个新功能或改进想法
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        先搜索既有 issue；与题库内容相关的建议请去 [facee-bank](https://github.com/HBxtzhn/facee-bank/issues)。
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述场景与痛点，而不是直接描述方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 有想法就写，没有可以留空
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 相关模块
      options:
        - 刷题 / 详情页
        - 搜索 / 筛选
        - 收藏 / 错题本 / 掌握度
        - 题库安装 / 切换 / 更新
        - 本地题库 / 备份
        - AI 导入 / AI 改题
        - 界面与交互
        - 其它
    validations:
      required: true
