name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: Android client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test --runInBand
      - run: node --test scripts/*.test.mjs
      - name: Expo SDK compatibility
        run: npx expo install --check
      # 三个已知上游无可安装补丁的工具链公告有记录；新增公告仍阻止合并。
      - run: node scripts/audit-dependencies.mjs
      - run: node scripts/generate-notices.mjs --check
      - name: Web 预览冒烟（UI 调试通道）
        run: npx expo export --platform web --output-dir web-build

  android-build:
    name: Android clean build (no release credentials)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
      - run: pnpm install --frozen-lockfile
      - run: npx expo prebuild --clean --platform android --no-install
      - run: chmod +x android/gradlew && cd android && NODE_ENV=development ./gradlew assembleDebug --no-daemon

  bank-spec:
    name: 题库规范工具链
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 生成示例题库并自校验
        working-directory: packages/bank-spec
        run: node generate.mjs --profile sample --zip dist/sample-bank.zip
      - name: 恶意包必须全部被拒
        working-directory: packages/bank-spec
        run: node generate.mjs --profile malicious --out dist/fixtures
