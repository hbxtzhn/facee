version: 2
updates:
  # Expo / React Native 生态升级快，依赖按月跟
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      expo:
        patterns:
          - 'expo'
          - 'expo-*'
          - '@expo/*'
      react-native:
        patterns:
          - 'react-native'
          - 'react-native-*'
          - 'react'
          - 'react-dom'
          - '@react-native/*'
          - '@react-navigation/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
