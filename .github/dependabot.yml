version: 2
updates:
  # 停止自动版本升级 PR；安全告警仍保留，安全更新 PR 在仓库设置中关闭。
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    labels: [dependencies]
    groups:
      expo:
        patterns:
          - 'expo'
          - 'expo-*'
          - '@expo/*'
      react-native:
        patterns:
          - 'react-native'
          - 'react-native-*'
          - 'react'
          - 'react-dom'
          - '@react-native/*'
          - '@react-navigation/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    labels: [dependencies, ci]
